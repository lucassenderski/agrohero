# ==========================================================
# AgroHero - blueprint de deploy (Render)
# ==========================================================
# Deploy do backend (Web Service) e do frontend (Static Site) em um
# unico arquivo. O banco NAO esta aqui de proposito: o PostgreSQL
# gratuito do Render expira em 30 dias e leva os dados junto. Usamos o
# Neon, cujo plano gratuito nao expira (ver docs/DEPLOY.md).
#
# COMO USAR:
#   1. suba este arquivo no repositorio (branch principal);
#   2. no Render: New + > Blueprint > escolha o repositorio;
#   3. o Render le este arquivo e cria os dois servicos;
#   4. preencha os segredos marcados com `sync: false` no painel.
#
# Documentacao completa do processo: docs/DEPLOY.md
# ==========================================================

services:
  # --------------------------------------------------------
  # API
  # --------------------------------------------------------
  - type: web
    name: agrohero-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci
    # As migrations rodam ANTES de subir, na mesma linha.
    #
    # Por que nao usar `preDeployCommand`: ele so existe em planos pagos
    # (docs.render.com/deploys). O plano gratuito o ignora, ou pior, o
    # deploy falha. Rodando aqui, o efeito no plano gratuito e o mesmo que
    # se espera do pre-deploy: se a migration falhar, o `&&` impede o
    # servidor de subir e a versao anterior continua no ar.
    #
    # Isso e seguro porque o migrations runner e idempotente: quando nao
    # ha nada pendente, ele apenas consulta a tabela de controle e sai.
    startCommand: npm run migrate && npm start
    # /health e um endpoint de infraestrutura, fora do /api/v1, que foi
    # justamente o caminho configurado aqui.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      # O Render injeta a porta; o backend ja le process.env.PORT.
      - key: PORT
        value: "10000"

      # Sem PostgreSQL na URL, a API sobe e responde 503 no /health.
      # Cole a connection string do Neon (termina com ?sslmode=require).
      - key: DATABASE_URL
        sync: false

      # Gere com:
      #   node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
      - key: JWT_SECRET
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false

      # Precisa ser a URL do frontend publicado, com https e SEM barra
      # no final. O backend recusa subir com "*" ou com "http://" em
      # producao (regra em src/config/verificacaoProducao.js).
      - key: CORS_ORIGINS
        sync: false

      # Documentacao (Swagger) desligada em producao.
      - key: ENABLE_API_DOCS
        value: "false"

      # Gateway de pagamento simulado. Trocar quando houver credenciais
      # reais do Mercado Pago.
      - key: PAYMENT_GATEWAY
        value: fake

  # --------------------------------------------------------
  # Interface
  # --------------------------------------------------------
  - type: web
    name: agrohero-web
    runtime: static
    rootDir: frontend
    # VITE_API_URL entra no bundle AGORA (build), nao em tempo de
    # execucao: o navegador que le, e nao ha servidor para injetar
    # depois. Trocar a URL exige um novo build.
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_APP_NOME
        value: AgroHero
    routes:
      # O React Router resolve as rotas no cliente. Sem este rewrite, um
      # F5 em /produtos/12 viraria 404 no servidor estatico.
      - type: rewrite
        source: /*
        destination: /index.html